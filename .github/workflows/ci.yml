name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'

jobs:
  # ── lint, types, unit tests ───────────────────────────────────────────────
  # The architecture boundary rule lives in `lint`. Import infrastructure from
  # the domain layer and the build goes red here — which is the only reason
  # the architecture stays real rather than aspirational.
  static:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ca/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Coverage gates (domain ≥ 95%, application ≥ 90%)
        run: pnpm --filter @ca/api exec vitest run --coverage

  # ── the database's own guarantees ─────────────────────────────────────────
  # No double booking, one live filing per assessment year, no unacknowledged
  # filing: all enforced by Postgres, so all tested against Postgres.
  database:
    name: Schema constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start Supabase (applies every migration, then the seed)
        run: supabase start
      - name: Constraint tests
        run: ./scripts/verify-schema.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Concurrent double-booking test
        run: ./scripts/verify-concurrency.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ── build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
      - name: Assert no server secret reached the browser bundle
        # A leaked service-role key bypasses RLS entirely. Cheap check, and it
        # runs before anything is ever deployed.
        run: |
          if grep -rIl --exclude-dir=node_modules \
               -e 'service_role' -e 'SERVICE_ROLE' -e 'SUPABASE_SERVICE' apps/web/dist; then
            echo "::error::A service-role reference reached the web bundle"
            exit 1
          fi
          echo "web bundle is clean"

  # ── end to end ────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ca/contracts build
      - run: pnpm --filter @ca/e2e exec playwright install --with-deps chromium
      - run: supabase start
      - name: Capture Supabase credentials
        run: |
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d= -f2 | tr -d '\"')" >> $GITHUB_ENV
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop
